name: Deploy to dev
run-name: Deploy ${{ inputs.ref || github.ref_name }} to dev

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to deploy to the dev site
        required: true
        default: dev

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Apply dev favicon
        run: cp src/main/resources/static/assets/icons/favicon-dev.svg src/main/resources/static/assets/icons/favicon.svg

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Deploy
        env:
          KEY: ${{ secrets.DEPLOY_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "$KEY" > /tmp/key && chmod 600 /tmp/key
          scp -i /tmp/key -o StrictHostKeyChecking=no \
            target/*.jar deploy@$HOST:/opt/teaneck/dev/app-new.jar
          ssh -i /tmp/key -o StrictHostKeyChecking=no deploy@$HOST "
            mv /opt/teaneck/dev/app-new.jar /opt/teaneck/dev/app.jar &&
            sudo systemctl restart teaneck-dev
          "

      - name: Health check
        env:
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          sleep 20
          ssh -i /tmp/key -o StrictHostKeyChecking=no deploy@$HOST \
            "curl --fail --retry 5 --retry-delay 5 http://localhost:8081/actuator/health"
