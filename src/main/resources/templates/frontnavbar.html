<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Nav</title>

    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-T2P4J8V');</script>
    <!-- End Google Tag Manager -->
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T2P4J8V"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <nav class="navbar navbar-expand-md navbar-light bg-light fixed-top">
    <div class="container container-m align-items-center" th:with="displaySiteName=${siteName} ?: 'Minyanim Platform'">
      <div class="logo-icon">
      <img src="/assets/icons/favicon.svg" alt="TM Logo">
      
        <a class="navbar-brand" href="/" th:text="${displaySiteName}"></a>    </div>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent" style="flex-grow: 0;">
        <ul class="d-flex navbar-nav ml-auto navbar-right align-items-center">
          <li class="nav-item"><a class="nav-link js-scroll-trigger" href="/#minyanim-box">Upcoming Minyanim</a></li>
          <li class="nav-item"><a class="nav-link js-scroll-trigger" href="/#shuls">Shuls</a></li>
          <li class="nav-item"><a class="nav-link js-scroll-trigger" href="/#about">About</a></li>
          <li class="nav-item"><a class="btn-cta nav-link js-scroll-trigger" href="/#info">Subscribe</a></li>
          <li class="nav-link js-scroll-trigger" th:text="${timenow}"></li>
        </ul>
      </div>
    </div>
  </nav>
  <th:block th:if="${feedbackEnabled}">
    <button class="feedback-launcher"
            type="button"
            data-bs-toggle="modal"
            data-bs-target="#feedback-modal"
            aria-label="Send feedback"
            title="Send feedback">
      <svg class="feedback-launcher-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3C6.48 3 2 6.84 2 11.58c0 2.72 1.48 5.15 3.79 6.72L5 22l4.14-2.1c.92.2 1.88.31 2.86.31 5.52 0 10-3.84 10-8.63S17.52 3 12 3Zm-4.1 9.05a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4Zm4.1 0a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4Zm4.1 0a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4Z"/>
      </svg>
    </button>

    <div class="modal fade feedback-modal" id="feedback-modal" tabindex="-1" aria-labelledby="feedback-modal-title" aria-hidden="true"
         th:attr="data-selected-date=${dateString},data-display-date=${onlyDate},data-app-version=${appVersion}">
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
          <form id="feedback-form" novalidate>
            <div class="modal-header">
              <h5 class="modal-title" id="feedback-modal-title">Send feedback</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label" for="feedback-message">Message</label>
                <textarea class="form-control" id="feedback-message" name="message" rows="5" maxlength="5000" required></textarea>
              </div>
              <div>
                <label class="form-label" for="feedback-email">Email <span>(optional)</span></label>
                <input class="form-control" id="feedback-email" name="email" type="email" autocomplete="email">
              </div>
              <div class="feedback-status" id="feedback-status" role="status" aria-live="polite"></div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-cta feedback-submit-button">
                <span class="feedback-submit-text">Send</span>
                <span class="spinner-border spinner-border-sm feedback-submit-spinner" aria-hidden="true"></span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script type="text/javascript" src="/feedback.js"></script>
  </th:block>
</body>
</html>
