<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">

<head>
    <meta charset="UTF-8">
    <title th:text="|Settings - ${siteName ?: 'Minyanim Platform'}|">Settings</title>

    <th:block layout:fragment="styles">
        <style>
            .settings-breadcrumb {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: var(--space-2, 0.5rem);
                color: var(--text-secondary, #6c757d);
                font-size: var(--font-size-sm, 0.875rem);
                margin-bottom: var(--space-5, 1.25rem);
            }

            .settings-breadcrumb a {
                color: var(--text-secondary, #6c757d);
                text-decoration: none;
            }

            .settings-breadcrumb a:hover {
                color: var(--text-primary, #212529);
            }

            .settings-shell {
                max-width: 1120px;
                margin: 0 auto;
            }

            .settings-tabs {
                display: flex;
                align-items: center;
                gap: var(--space-5, 1.25rem);
                margin-bottom: var(--space-6, 1.5rem);
                border-bottom: 1px solid var(--border-color, #dee2e6);
                overflow-x: auto;
            }

            .settings-tab {
                display: inline-flex;
                align-items: center;
                gap: var(--space-2, 0.5rem);
                color: var(--text-secondary, #6c757d);
                padding: 0 0 var(--space-3, 0.75rem);
                border-bottom: 2px solid transparent;
                white-space: nowrap;
                text-decoration: none;
            }

            .settings-tab:first-child {
                color: var(--text-primary, #212529);
                border-color: var(--text-primary, #212529);
            }

            .settings-tab:hover {
                color: var(--text-primary, #212529);
                text-decoration: none;
            }

            .settings-status-panel {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: var(--space-4, 1rem);
                padding: var(--space-4, 1rem);
                margin-bottom: var(--space-8, 2rem);
                background: #eef8ff;
                border: 1px solid #b8dff5;
                border-left: 4px solid var(--color-info, #2196f3);
                border-radius: var(--radius-lg, 0.5rem);
            }

            .settings-status-copy {
                display: flex;
                align-items: flex-start;
                gap: var(--space-3, 0.75rem);
                min-width: 0;
            }

            .settings-status-icon {
                color: var(--color-info, #2196f3);
                padding-top: 0.15rem;
                flex: 0 0 auto;
            }

            .settings-status-title {
                color: var(--text-primary, #212529);
                font-weight: var(--font-weight-semibold, 600);
                margin-bottom: var(--space-1, 0.25rem);
            }

            .settings-status-text {
                color: var(--text-secondary, #6c757d);
                margin: 0;
            }

            .provider-pill {
                display: inline-flex;
                align-items: center;
                gap: var(--space-2, 0.5rem);
                padding: var(--space-2, 0.5rem) var(--space-3, 0.75rem);
                color: var(--text-primary, #212529);
                background: var(--bg-surface, #fff);
                border: 1px solid var(--border-color, #dee2e6);
                border-radius: var(--radius-full, 9999px);
                font-size: var(--font-size-sm, 0.875rem);
                white-space: nowrap;
            }

            .settings-section {
                display: grid;
                grid-template-columns: minmax(180px, 280px) minmax(0, 1fr);
                gap: var(--space-8, 2rem);
                align-items: start;
                margin-bottom: var(--space-6, 1.5rem);
            }

            .section-copy {
                position: sticky;
                top: calc(var(--navbar-height, 3.5rem) + var(--space-5, 1.25rem));
            }

            .section-title {
                display: flex;
                align-items: center;
                gap: var(--space-2, 0.5rem);
                font-size: var(--font-size-xl, 1.25rem);
                margin-bottom: var(--space-2, 0.5rem);
            }

            .section-title i {
                color: var(--color-primary, #275ed8);
                width: 1.2rem;
                text-align: center;
            }

            .section-description {
                color: var(--text-secondary, #6c757d);
                margin: 0;
            }

            .settings-panel {
                background: var(--bg-surface, #fff);
                border: 1px solid var(--border-color, #dee2e6);
                border-radius: var(--radius-lg, 0.5rem);
                box-shadow: var(--shadow-sm, 0 1px 2px rgba(0, 0, 0, 0.05));
                overflow: hidden;
            }

            .setting-field-form {
                display: grid;
                grid-template-columns: minmax(180px, 280px) minmax(260px, 1fr);
                gap: var(--space-4, 1rem);
                align-items: center;
                padding: var(--space-4, 1rem) var(--space-5, 1.25rem);
                border-bottom: 1px solid var(--border-color-light, #e9ecef);
            }

            .setting-field-form:last-child {
                border-bottom: 0;
            }

            .field-label {
                display: block;
                color: var(--text-primary, #212529);
                font-weight: var(--font-weight-semibold, 600);
                margin-bottom: var(--space-1, 0.25rem);
            }

            .field-description {
                color: var(--text-secondary, #6c757d);
                font-size: var(--font-size-sm, 0.875rem);
                margin: 0;
            }

            .field-control {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 2.5rem minmax(5rem, auto);
                gap: var(--space-2, 0.5rem);
                align-items: center;
            }

            .field-input {
                width: 100%;
                height: 2.75rem;
                padding: 0 var(--space-3, 0.75rem);
                color: var(--text-primary, #212529);
                background: var(--bg-surface, #fff);
                border: 1px solid var(--border-color-dark, #ced4da);
                border-radius: var(--radius-md, 0.375rem);
                font-size: var(--font-size-base, 1rem);
            }

            .field-input[type="color"] {
                padding: 0.25rem;
                cursor: pointer;
            }

            .field-input:focus {
                border-color: var(--text-primary, #212529);
                box-shadow: 0 0 0 2px rgba(33, 37, 41, 0.08);
                outline: none;
            }

            .field-save-button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 2.5rem;
                height: 2.5rem;
                color: var(--text-primary, #212529);
                background: var(--bg-surface, #fff);
                border: 1px solid var(--border-color-dark, #ced4da);
                border-radius: var(--radius-md, 0.375rem);
                cursor: pointer;
                transition: border-color var(--transition-fast, 150ms ease),
                            background var(--transition-fast, 150ms ease),
                            color var(--transition-fast, 150ms ease);
            }

            .field-save-button:hover,
            .field-save-button:focus {
                color: var(--color-accent-dark, #388e3c);
                border-color: var(--color-accent, #4caf50);
                outline: none;
            }

            .field-save-button.saving {
                color: var(--text-secondary, #6c757d);
                pointer-events: none;
            }

            .field-state {
                display: inline-flex;
                align-items: center;
                gap: var(--space-1, 0.25rem);
                color: var(--text-secondary, #6c757d);
                font-size: var(--font-size-sm, 0.875rem);
                min-width: 5rem;
                max-width: 12rem;
                white-space: nowrap;
            }

            .field-state span {
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .field-state.unsaved {
                color: var(--color-warning, #ff9800);
            }

            .field-state.saved {
                color: var(--color-accent-dark, #388e3c);
            }

            .field-state.error {
                color: var(--color-danger, #f44336);
                max-width: 16rem;
                white-space: normal;
            }

            @media (max-width: 900px) {
                .settings-section {
                    grid-template-columns: 1fr;
                    gap: var(--space-3, 0.75rem);
                }

                .section-copy {
                    position: static;
                }

                .setting-field-form {
                    grid-template-columns: 1fr;
                }
            }

            @media (max-width: 560px) {
                .settings-status-panel {
                    align-items: flex-start;
                    flex-direction: column;
                }

                .field-control {
                    grid-template-columns: minmax(0, 1fr) 2.5rem;
                }

                .field-state {
                    grid-column: 1 / -1;
                    max-width: 100%;
                }
            }
        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <div class="settings-shell">
        <div class="settings-breadcrumb">
            <a th:href="@{/admin/organizations}">Dashboard</a>
            <span>/</span>
            <span>Settings</span>
        </div>

        <div class="page-header">
            <div>
                <h1 class="page-title">Settings</h1>
                <p class="page-description">Manage site, location, mobile, service, and calendar defaults.</p>
            </div>
            <div class="page-actions">
                <a class="btn-modern btn-secondary" th:href="@{/admin/settings/email}">
                    <i class="fas fa-envelope"></i>
                    <span>Email Settings</span>
                </a>
            </div>
        </div>

        <nav class="settings-tabs" aria-label="Settings sections">
            <a th:each="section : ${settingSections}"
               class="settings-tab"
               th:href="${'#' + section.id}"
               th:text="${section.title}">Section</a>
        </nav>

        <div class="settings-status-panel">
            <div class="settings-status-copy">
                <i class="fas fa-sliders settings-status-icon"></i>
                <div>
                    <div class="settings-status-title">Application Configuration</div>
                    <p class="settings-status-text">Each setting saves independently and applies after validation.</p>
                </div>
            </div>
            <div class="provider-pill">
                <i class="fas fa-envelope"></i>
                <span th:text="${emailProvider != null and !emailProvider.isBlank() ? 'Email: ' + emailProvider : 'Email: Disabled'}">Email: Disabled</span>
            </div>
        </div>

        <section th:each="section : ${settingSections}" class="settings-section" th:id="${section.id}">
            <div class="section-copy">
                <h2 class="section-title">
                    <i th:class="${'fas ' + section.icon}"></i>
                    <span th:text="${section.title}">Section</span>
                </h2>
                <p class="section-description" th:text="${section.description}">Section description</p>
            </div>

            <div class="settings-panel">
                <form th:each="field : ${section.fields}"
                      class="setting-field-form"
                      th:action="@{/admin/settings/update-field}"
                      method="post"
                      th:data-key="${field.key}"
                      th:data-sensitive="${field.sensitive}">
                    <div>
                        <label class="field-label" th:for="${field.htmlId}" th:text="${field.label}">Setting</label>
                        <p class="field-description" th:text="${field.description}">Description</p>
                    </div>

                    <div class="field-control">
                        <input type="hidden" name="settingKey" th:value="${field.key}">

                        <select th:if="${field.hasOptions}"
                                class="field-input"
                                name="settingValue"
                                th:id="${field.htmlId}">
                            <option th:each="option : ${field.options}"
                                    th:value="${option.value}"
                                    th:selected="${option.value == field.value}"
                                    th:text="${option.label}">Option</option>
                        </select>

                        <input th:unless="${field.hasOptions}"
                               class="field-input"
                               name="settingValue"
                               th:id="${field.htmlId}"
                               th:type="${field.inputType}"
                               th:value="${field.inputType == 'color' and (field.value == null or field.value.isBlank()) ? '#275ed8' : field.value}"
                               th:placeholder="${field.placeholder}"
                               th:step="${field.step}"
                               th:attr="list=${field.timezone ? 'timezone-options' : null}">

                        <button class="field-save-button" type="submit" th:attr="aria-label=${'Save ' + field.label}">
                            <i class="fas fa-check"></i>
                        </button>

                        <span class="field-state">
                            <i class="far fa-circle"></i>
                            <span th:text="${field.displayValue}">Not set</span>
                        </span>
                    </div>
                </form>
            </div>
        </section>

        <datalist id="timezone-options"></datalist>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-timezone@0.5.43/builds/moment-timezone-with-data.min.js"></script>

    <script>
        const successMsg = /*[[${success}]]*/ null;
        const errorMsg = /*[[${error}]]*/ null;

        if (successMsg) {
            showToast('success', successMsg);
        }
        if (errorMsg) {
            showToast('error', errorMsg);
        }

        const timezoneOptions = document.getElementById('timezone-options');
        if (timezoneOptions && window.moment && moment.tz) {
            moment.tz.names().forEach(function(timezone) {
                const option = document.createElement('option');
                option.value = timezone;
                timezoneOptions.appendChild(option);
            });
        }

        function markFieldUnsaved(form) {
            const state = form.querySelector('.field-state');
            const stateText = state.querySelector('span');
            const stateIcon = state.querySelector('i');

            state.className = 'field-state unsaved';
            stateIcon.className = 'far fa-circle-dot';
            stateText.textContent = 'Unsaved';
        }

        document.querySelectorAll('.setting-field-form').forEach(function(form) {
            const input = form.querySelector('[name="settingValue"]');

            if (input) {
                input.addEventListener('input', function() {
                    markFieldUnsaved(form);
                });
                input.addEventListener('change', function() {
                    markFieldUnsaved(form);
                });
            }

            form.addEventListener('submit', async function(event) {
                event.preventDefault();

                const button = form.querySelector('.field-save-button');
                const state = form.querySelector('.field-state');
                const stateText = state.querySelector('span');
                const stateIcon = state.querySelector('i');
                const fieldInput = form.querySelector('[name="settingValue"]');
                const sensitive = form.getAttribute('data-sensitive') === 'true';

                button.classList.add('saving');
                state.className = 'field-state';
                stateIcon.className = 'fas fa-spinner fa-spin';
                stateText.textContent = 'Saving';

                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                        body: new URLSearchParams(new FormData(form))
                    });
                    const result = await response.json();

                    if (!response.ok || !result.success) {
                        throw new Error(result.message || 'Setting could not be saved.');
                    }

                    state.className = 'field-state saved';
                    stateIcon.className = 'fas fa-check-circle';
                    stateText.textContent = result.displayValue || 'Saved';

                    if (sensitive && fieldInput) {
                        fieldInput.value = '';
                        fieldInput.placeholder = 'Saved value hidden - enter a new value to replace';
                    }

                    if (window.showToast) {
                        showToast('success', result.message || 'Saved');
                    }
                } catch (error) {
                    state.className = 'field-state error';
                    stateIcon.className = 'fas fa-exclamation-circle';
                    stateText.textContent = error.message;

                    if (window.showToast) {
                        showToast('error', error.message);
                    }
                } finally {
                    button.classList.remove('saving');
                }
            });
        });
    </script>
</th:block>
</body>
</html>
