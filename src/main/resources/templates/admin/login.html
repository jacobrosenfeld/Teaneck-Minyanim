<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="|Login - ${siteName ?: 'Minyanim Platform'} Admin|"></title>
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
    <link rel="icon" type="image/png" href="/assets/icons/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
    <link rel="manifest" href="/assets/icons/site.webmanifest">
    <link rel="mask-icon" href="/assets/icons/safari-pinned-tab.svg" color="#275ed8">
    
    <meta name="msapplication-TileColor" content="#275ed8">
    <meta name="msapplication-config" content="/assets/icons/browserconfig.xml">
    <meta name="theme-color" content="#ffffff">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <script src="https://code.jquery.com/jquery-3.6.3.min.js"
        integrity="sha256-pvPw+upLPUjgMXY0G+8O0xUf+/Im1MZjXxxgOcBQBXU=" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3"
        crossorigin="anonymous"></script>
    <link th:rel="stylesheet" th:href="@{/styles.css}">
    <link th:rel="stylesheet" th:href="@{/admin/styles.css}">
    <link th:rel="stylesheet" th:href="@{/admin/login.css}">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/animate.css"> <!-- Resource style -->
    <link rel="stylesheet" href="/assets/css/owl.carousel.css">
    <link rel="stylesheet" href="/assets/css/owl.theme.css">
    <link rel="stylesheet" href="/assets/css/ionicons.min.css"> <!-- Resource style -->
    <link href="/assets/css/style.css" rel="stylesheet" type="text/css" media="all" />
    <script type="text/javascript" src="/assets/js/plugins.js"></script>
    <script type="text/javascript" src="/assets/js/custom.js"></script>
</head>

<body>
    <div class="wrapper">
        <!-- Navbar Section -->
        <div id="wrapper" class="horizontal-container d-flex container-xl">
            <th:block th:include="~{frontnavbar}"></th:block>
            <!-- Navbar End -->
            <div class="container-fluid home-container" id="main">
                <div class="row" style="flex-direction: column;">
                    <main class="col main login-main">
                        <div class="login-shell">
                            <section class="login-panel" aria-labelledby="login-title">
                                <div class="login-brand">
                                    <img src="/assets/icons/favicon.svg" alt="" class="login-brand-mark">
                                    <h1 id="login-title" th:text="|${siteName ?: 'Minyanim Platform'} Admin|">Minyanim Platform Admin</h1>
                                </div>

                                <form id="identifier-form" class="login-identifier-form"
                                      th:action="@{/admin/login/magic-link}" method="post"
                                      th:attr="data-auth-methods-url=@{/admin/login/auth-methods},
                                               data-magic-link-url=@{/admin/login/magic-link/request},
                                               data-webauthn-options-url=@{/webauthn/authenticate/options},
                                               data-webauthn-login-url=@{/login/webauthn}">
                                    <label for="login-identifier-field">Email or Username</label>
                                    <div class="login-identifier-row">
                                        <input type="text" name="identifier" id="login-identifier-field"
                                               autocomplete="username" autocapitalize="off" spellcheck="false">
                                        <button type="submit" class="login-submit" id="identifier-submit" disabled
                                                aria-label="Continue">
                                            <span class="login-submit-arrow" aria-hidden="true">&rarr;</span>
                                            <span class="login-loading-dots" aria-hidden="true">
                                                <span></span><span></span><span></span>
                                            </span>
                                        </button>
                                    </div>
                                </form>

                                <div id="login-flow-status"
                                     class="login-status"
                                     th:classappend="${error != null} ? ' login-status-error' : (${magicLinkMessage != null or param.logout} ? ' login-status-success' : '')"
                                     role="status"
                                     aria-live="polite">
                                    <span th:if="${magicLinkMessage != null}" th:text="${magicLinkMessage}">
                                        If this email is authorized, a sign-in link will be sent shortly.
                                    </span>
                                    <span th:if="${param.logout}">You have been logged out.</span>
                                    <span th:if="${error != null}"
                                          th:text="${error == 'recaptcha'} ? 'Please complete the sign-in check and try again.' : 'Invalid credentials.'">
                                        Invalid credentials.
                                    </span>
                                </div>

                                <button type="button"
                                        class="login-secondary-action"
                                        id="password-toggle"
                                        th:classappend="${error == null and magicLinkMessage == null} ? ' d-none' : ''">
                                    Password instead
                                </button>

                                <form id="login-form"
                                      class="login-password-panel"
                                      th:classappend="${error != null} ? ' is-open' : ''"
                                      onsubmit="preparePasswordLogin()"
                                      th:action="@{/j_spring_security_check}" method="post"
                                      data-recaptcha-action="login"
                                      data-recaptcha-status="login-recaptcha-status">
                                    <input type="hidden" name="username" id="password-username-field">
                                    <label for="password-field">Password</label>
                                    <input type="password" class="form-control" name="password"
                                           id="password-field" placeholder="Password" autocomplete="current-password">
                                    <input type="hidden" name="recaptchaToken" value="">
                                    <button type="submit" class="login-password-submit">Sign in with password</button>
                                    <div id="login-recaptcha-status" class="form-msg-fatal" role="status" aria-live="polite"></div>
                                </form>
                            </section>
                        </div>
                    </main>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer Section -->
    <div class="footer-sm">
        <div class="container">
          <div class="row">
            <div class="col-md-4">
              <a class="footer-logo" href="https://teaneckminyanim.com">TB Dev</a>
            </div>
                        <div class="col-md-4">
                            <h6 th:text="|© TB Dev and ${siteName ?: 'Minyanim Platform'}|"></h6>
                        </div>
            <div class="col-md-4 text-end">
              <h6><a th:href="@{'mailto:' + (supportEmail ?: 'info@teaneckminyanim.com')}" th:text="${supportEmail ?: 'info@teaneckminyanim.com'}"></a></h6>
            </div>
          </div>
        </div>
      </div>
    
    <script th:src="@{/admin/login.js}"></script>
</body>

</html>
