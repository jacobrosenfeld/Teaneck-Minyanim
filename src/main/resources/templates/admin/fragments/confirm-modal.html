<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
    Shared confirmation dialog. Include once per page, inside the layout's "modals" fragment:
        <th:block layout:fragment="modals">
            <th:block th:replace="~{admin/fragments/confirm-modal :: confirmModal}"></th:block>
        </th:block>
    Triggers carry data-confirm and the data-confirm-* attributes documented in /admin/confirm-modal.js.
    Any modal on the page can also use the .admin-modal styling defined here.
-->
<th:block th:fragment="confirmModal">
    <style>
        .admin-modal .modal-dialog {
            max-width: 34rem;
        }

        .admin-modal .modal-content {
            overflow: hidden;
            border: 1px solid var(--border-color-light, #e9ecef);
            border-radius: var(--radius-xl, 0.75rem);
            background: var(--bg-surface, #fff);
            box-shadow: var(--shadow-xl, 0 20px 25px rgba(0, 0, 0, 0.14));
        }

        .admin-modal .modal-header {
            align-items: flex-start;
            gap: var(--space-4, 1rem);
            padding: var(--space-6, 1.5rem) var(--space-6, 1.5rem) var(--space-4, 1rem);
            border: 0;
        }

        .admin-modal-heading {
            display: flex;
            align-items: center;
            gap: var(--space-3, 0.75rem);
            min-width: 0;
        }

        .admin-modal-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 2.5rem;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: var(--radius-full, 9999px);
            color: var(--color-primary, #275ed8);
            background: var(--color-primary-lighter, #e3ecfa);
        }

        .admin-modal-icon.danger {
            color: #b42318;
            background: #fef3f2;
        }

        .admin-modal-icon.warning {
            color: #b54708;
            background: #fffaeb;
        }

        .admin-modal .modal-title {
            margin: 0;
            color: var(--text-primary, #212529);
            font-size: var(--font-size-xl, 1.25rem);
            font-weight: var(--font-weight-semibold, 600);
            line-height: var(--line-height-tight, 1.25);
            overflow-wrap: anywhere;
        }

        .admin-modal .close {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 2rem;
            width: 2rem;
            height: 2rem;
            margin: 0 0 0 auto;
            padding: 0;
            border: 0;
            border-radius: var(--radius-full, 9999px);
            color: var(--text-secondary, #6c757d);
            background: transparent;
            font-size: var(--font-size-base, 1rem);
            opacity: 1;
            text-shadow: none;
        }

        .admin-modal .close:hover,
        .admin-modal .close:focus {
            color: var(--text-primary, #212529);
            background: var(--bg-hover, #f5f5f5);
        }

        .admin-modal .modal-body {
            padding: 0 var(--space-6, 1.5rem) var(--space-6, 1.5rem);
            color: var(--text-secondary, #6c757d);
            font-size: var(--font-size-base, 1rem);
            line-height: var(--line-height-relaxed, 1.75);
        }

        .admin-modal-detail {
            margin-top: var(--space-3, 0.75rem);
            padding: var(--space-3, 0.75rem) var(--space-4, 1rem);
            color: var(--text-primary, #212529);
            background: var(--bg-body, #f8f9fa);
            border: 1px solid var(--border-color-light, #e9ecef);
            border-radius: var(--radius-lg, 0.5rem);
            font-size: var(--font-size-sm, 0.875rem);
            overflow-wrap: anywhere;
        }

        .admin-modal .modal-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: var(--space-3, 0.75rem);
            padding: var(--space-4, 1rem) var(--space-6, 1.5rem);
            background: var(--bg-body, #f8f9fa);
            border-top: 1px solid var(--border-color-light, #e9ecef);
        }

        .admin-modal .modal-footer > * {
            margin: 0;
        }

        @media (max-width: 480px) {
            .admin-modal .modal-footer {
                flex-direction: column-reverse;
                align-items: stretch;
            }
        }
    </style>

    <noscript>
        <div class="alert alert-warning m-3" role="alert">
            JavaScript is required to confirm and complete delete or disable actions on this page.
        </div>
    </noscript>

    <div class="modal fade admin-modal" id="confirm-modal" tabindex="-1" role="dialog"
         aria-modal="true" aria-labelledby="confirm-modal-title" aria-describedby="confirm-modal-message"
         aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="admin-modal-heading">
                        <span class="admin-modal-icon danger" data-confirm-part="icon" aria-hidden="true"><i class="fas fa-triangle-exclamation"></i></span>
                        <h5 class="modal-title" id="confirm-modal-title" data-confirm-part="title">Are you sure?</h5>
                    </div>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <i class="fas fa-xmark" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <p class="mb-0" id="confirm-modal-message" data-confirm-part="message">This action cannot be undone.</p>
                    <div class="admin-modal-detail" data-confirm-part="detail" hidden></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-modern btn-outline" data-dismiss="modal" data-confirm-part="cancel">Cancel</button>
                    <button type="button" class="btn-modern btn-danger" data-confirm-part="confirm"><span>Confirm</span></button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/admin/confirm-modal.js}"></script>
</th:block>
</body>
</html>
