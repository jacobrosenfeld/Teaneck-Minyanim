spring.jpa.hibernate.dialect = org.hibernate.dialect.MariaDBDialect
logging.level.org.springframework.web: DEBUG

# Password login is an emergency rollback only. Enable explicitly per environment.
auth.password-login.enabled=${AUTH_PASSWORD_LOGIN_ENABLED:false}
auth.magic-link.enabled=${AUTH_MAGIC_LINK_ENABLED:true}
auth.passkeys.enabled=${AUTH_PASSKEYS_ENABLED:true}

# Initial bootstrap requires an explicit email; no known default credential is created.
superadmin.username=${SUPERADMIN_USERNAME:admin}
superadmin.email=${SUPERADMIN_EMAIL:}

server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# OpenAPI spec — available at /api/docs.json
# Interactive docs are served by Scalar at /api/docs (see ScalarDocsController)
springdoc.api-docs.path=/api/docs.json
springdoc.swagger-ui.enabled=false
springdoc.packages-to-scan=com.tbdev.teaneckminyanim.api
springdoc.paths-to-match=/api/v1/**

# API rate limiting (requests per minute per IP)
api.ratelimit.requests-per-minute=60
api.ratelimit.feedback-requests-per-minute=5

# Reversible encryption key for sensitive application settings.
